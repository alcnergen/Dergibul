name: Test ve yayınla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Bot'un veri commit'leri push tetiklemediği için veri güncellemesinden sonra da yayınla
  workflow_run:
    workflows: ["Veri güncelle", "Veriyi şifrele"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - run: node --test tests/*.test.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  yayinla:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Yalnızca site dosyaları ve şifreli veri yayınlanır
      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site/data
          cp -r index.html assets _site/
          if ls data/*.enc.json >/dev/null 2>&1; then cp data/*.enc.json _site/data/; else cp data/*.json _site/data/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dagit
        uses: actions/deploy-pages@v4
