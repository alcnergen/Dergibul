name: Veri güncelle

on:
  schedule:
    - cron: "17 3 * * 1"   # her pazartesi 03:17 UTC
  workflow_dispatch:
    inputs:
      max_dergi:
        description: "Bu çalıştırmada ölçülecek en fazla TR Dizin dergisi"
        default: "100"

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yurtdışı listesi (SJR + Web of Science dosyaları)
        run: |
          set -e
          ARGS=""
          if curl -fsSL -A "Mozilla/5.0" -o /tmp/scimagojr.csv "https://www.scimagojr.com/journalrank.php?out=xls" \
             && head -1 /tmp/scimagojr.csv | grep -q "SJR Best Quartile"; then
            ARGS="$ARGS --sjr /tmp/scimagojr.csv"
          elif [ -f data/kaynak/scimagojr.csv ]; then
            ARGS="$ARGS --sjr data/kaynak/scimagojr.csv"
          fi
          for e in ssci esci scie ahci jcr; do
            [ -f "data/kaynak/wos/$e.csv" ] && ARGS="$ARGS --$e data/kaynak/wos/$e.csv"
          done
          if [ -n "$ARGS" ]; then python3 scripts/uluslararasi_guncelle.py $ARGS; else echo "Kaynak yok, atlandı."; fi

      - name: TR Dizin dergilerini DergiPark'tan ölç
        if: hashFiles('data/kaynak/trdizin_dergiler.csv') != ''
        run: python3 scripts/trdizin_guncelle.py --max-dergi "${{ github.event.inputs.max_dergi || '100' }}"

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "dergibul-bot"
          git config user.email "dergibul-bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Veri güncellemesi $(date -u +%F)"
          git push
