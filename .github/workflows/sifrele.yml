name: Veriyi şifrele

# Parolayı (DERGIBUL_PAROLA sırrı) ilk kez tanımladıktan ya da değiştirdikten sonra elle çalıştırın:
# mevcut veriyi şifreler, düz kopyaları depodan kaldırır ve siteyi yeniden yayınlatır.
# Parola değiştirilecekse eski parolayı ESKI_PAROLA sırrına koyun; şifreli dosyalar onunla çözülür.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  sifrele:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Varsa şifreli veriyi çöz
        env:
          DERGIBUL_PAROLA: ${{ secrets.ESKI_PAROLA || secrets.DERGIBUL_PAROLA }}
        run: python3 scripts/sifrele.py coz
      - name: Şifrele ve kaydet
        env:
          DERGIBUL_PAROLA: ${{ secrets.DERGIBUL_PAROLA }}
        run: |
          if [ -z "$DERGIBUL_PAROLA" ]; then echo "::error::Önce DERGIBUL_PAROLA sırrını tanımlayın."; exit 1; fi
          scripts/kaydet.sh "Veri şifrelendi"
